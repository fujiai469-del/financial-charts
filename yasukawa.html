<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安川電機 財務推移</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .chart-wrapper {
            position: relative;
            height: 500px;
            margin-bottom: 20px;
        }
        .data-table {
            margin-top: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        td:first-child, th:first-child {
            text-align: left;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .note {
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            margin-top: 15px;
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #95a5a6;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>安川電機：売上収益・営業利益・営業利益率の推移</h1>
        <p class="subtitle">単位：売上収益・営業利益＝億円、営業利益率＝％（IFRSベース／2022年2月期〜2026年2月期予想）</p>
        
        <div class="chart-wrapper">
            <canvas id="financialChart"></canvas>
        </div>

        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th>決算期</th>
                        <th>売上収益（億円）</th>
                        <th>営業利益（億円）</th>
                        <th>営業利益率（%）</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
        
        <p class="note">※2026/2は会社予想値（2025年10月時点の修正後予想に基づく概算）</p>
        <div class="footer">出所：同社の決算短信・決算説明資料などの開示資料を基に作成（数値は概算）</div>
    </div>

    <script>
        // 会社名（必要に応じて差し替え可能）
        const companyName = '安川電機';

        // データ（必要に応じて他社用に差し替え可能）
        // 単位：億円
        const years = ['2022/2', '2023/2', '2024/2', '2025/2', '2026/2(予)'];
        const sales = [4791, 5559, 5757, 5377, 5250];   // 売上収益（概算）
        const opProfit = [529, 683, 662, 502, 480];     // 営業利益（概算）

        // 営業利益率を自動計算（小数1桁に丸め）
        const opm = opProfit.map((p, i) => ((p / sales[i]) * 100).toFixed(1));

        // テーブルにデータを追加
        const tableBody = document.getElementById('dataTableBody');
        years.forEach((year, i) => {
            const row = tableBody.insertRow();
            row.innerHTML = `
                <td>${year}</td>
                <td>${sales[i].toLocaleString()}</td>
                <td>${opProfit[i].toLocaleString()}</td>
                <td>${opm[i]}%</td>
            `;
        });

        // グラフ作成
        const ctx = document.getElementById('financialChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: years,
                datasets: [
                    {
                        label: '売上収益（億円）',
                        data: sales,
                        backgroundColor: 'rgba(135, 206, 250, 0.7)',
                        borderColor: 'rgba(135, 206, 250, 1)',
                        borderWidth: 2,
                        yAxisID: 'y',
                        order: 2
                    },
                    {
                        label: '営業利益（億円）',
                        data: opProfit,
                        backgroundColor: 'rgba(144, 238, 144, 0.7)',
                        borderColor: 'rgba(144, 238, 144, 1)',
                        borderWidth: 2,
                        yAxisID: 'y',
                        order: 2
                    },
                    {
                        label: '営業利益率（%）',
                        data: opm,
                        type: 'line',
                        borderColor: 'rgba(255, 165, 0, 1)',
                        backgroundColor: 'rgba(255, 165, 0, 0.1)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        pointBackgroundColor: 'rgba(255, 165, 0, 1)',
                        yAxisID: 'y1',
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: {
                                size: 13
                            },
                            usePointStyle: true,
                            padding: 15
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    if (context.datasetIndex === 2) {
                                        label += context.parsed.y + '%';
                                    } else {
                                        label += context.parsed.y + '億円';
                                    }
                                }
                                return label;
                            }
                        }
                    },
                    title: {
                        display: true,
                        text: companyName + 'の売上収益・営業利益・営業利益率の推移',
                        font: {
                            size: 16,
                            weight: 'bold'
                        },
                        padding: {
                            top: 0,
                            bottom: 10
                        }
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: '金額（億円）',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        min: 0,
                        max: Math.max(...sales) * 1.2,
                        ticks: {
                            font: {
                                size: 12
                            }
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: '営業利益率（％）',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        min: 0,
                        max: Math.max(...opm.map(v => parseFloat(v))) * 1.5,
                        grid: {
                            drawOnChartArea: false,
                        },
                        ticks: {
                            font: {
                                size: 12
                            }
                        }
                    },
                    x: {
                        ticks: {
                            font: {
                                size: 12
                            }
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
